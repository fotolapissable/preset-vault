  header .mark{display:flex; align-items:center; gap:.6rem; font-family:var(--serif); font-size:1.05rem; color:var(--text-dim); margin-bottom:1.6rem;}

  h1{font-family:var(--serif); font-weight:400; font-size:2.05rem; line-height:1.15; margin:0 0 .35rem;}
  h1 em{font-style:italic; color:var(--amber-light);}
  .sub{color:var(--text-dim); font-size:.92rem; max-width:38ch; line-height:1.5;}

  .searchbar{

  .chip.active{border-color:var(--amber); color:var(--amber-light); background:rgba(200,129,58,.1);}

  .resultcount{margin-top:1.1rem; font-size:.78rem; color:var(--text-faint);}

  .group-title{

  .card .srctag{

  .card .quando{color:var(--text-dim); font-size:.85rem; margin-top:.4rem; line-height:1.5;}
  .card .filename{font-family:var(--mono); font-size:.72rem; color:var(--text-faint); margin-top:.5rem;}

  .overlay{
    position:fixed; inset:0; background:rgba(10,9,8,.75); z-index:30;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex;}
  .detail{
    background:var(--bg); width:100%; max-width:680px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;

  .detail .closebar button{

  .detail .field .fval{color:var(--text); font-size:.9rem; line-height:1.55;}
  .detail .field .fval.warn{color:var(--amber-light);}

  .ptable{width:100%; border-collapse:collapse; margin-top:.3rem;}
  .ptable tr{border-bottom:1px solid var(--line);}
  .ptable tr:last-child{border-bottom:none;}
  .ptable td{padding:.55rem .2rem; font-size:.85rem; vertical-align:top;}

  .ptable td:last-child{color:var(--text-faint); font-size:.78rem;}

  footer{margin-top:2.5rem; padding-top:1.25rem; border-top:1px solid var(--line); font-size:.75rem; color:var(--text-faint); display:flex; justify-content:space-between;}

  .install-toast{
    position:fixed; left:1rem; right:1rem; bottom:1rem; background:var(--bg-raised); border:1px solid var(--amber);

  .install-toast .dismiss{background:none; color:var(--text-faint); padding:.5rem;}

const FILTERS = [
  {key:'all', label:'Tutti'},
  {key:'etna', label:'Etna'},
  {key:'macro', label:'Macro'},
  {key:'fiori', label:'Fiori'},
  {key:'mare', label:'Mare'},
  {key:'food', label:'Food'},
  {key:'social', label:'Social'},
  {key:'notte', label:'Notte/Eventi'},
];

let activeFilter = 'all';
let query = '';

function normalize(s){ return (s||'').toLowerCase(); }

function matches(item){
  if (activeFilter !== 'all' && !item.tags.includes(activeFilter)) return false;
  if (!query) return true;
  const q = normalize(query);
  const hay = normalize([item.name, item.quando, item.group, item.file, (item.tags||[]).join(' ')].join(' '));
  return hay.includes(q);
}

function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = FILTERS.map(f => `<span class="chip ${activeFilter===f.key?'active':''}" data-key="${f.key}">${f.label}</span>`).join('');
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => { activeFilter = c.dataset.key; renderChips(); renderList(); });
}

function renderList(){
  const filtered = DATA.filter(matches);
  document.getElementById('resultcount').textContent = `${filtered.length} preset`;

  const groups = {};
  filtered.forEach(item => { (groups[item.group] = groups[item.group] || []).push(item); });

  const container = document.getElementById('groups');
  if (filtered.length === 0){
    container.innerHTML = `<p style="color:var(--text-faint); font-size:.9rem; margin-top:2rem;">Nessun preset trovato. Prova un altro termine.</p>`;
    return;
  }

  container.innerHTML = Object.keys(groups).map(g => `
    <div class="group-title">${g}</div>
    ${groups[g].map(item => `
      <div class="card" data-id="${item.id}">
        <div class="row1">
          <h3>${item.name}</h3>
          <span class="srctag ${item.source.includes('DNG')?'dng':''}">${item.source.split(' ')[0] === 'CR3' ? 'CR3' : (item.source.includes('DNG') ? 'DNG' : item.source.split(' ')[0])}</span>
        </div>
        <div class="quando">${item.quando}</div>
        <div class="filename">${item.file}</div>
      </div>
    `).join('')}
  `).join('');

  container.querySelectorAll('.card').forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

function openDetail(id){
  const item = DATA.find(d => d.id === id);
  if (!item) return;
  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <div class="closebar"><button id="closeDetail">✕</button></div>
    <h2>${item.name}</h2>
    <div class="filename">${item.file}</div>

    <div class="field">
      <div class="flabel">Quando usarlo</div>
      <div class="fval">${item.quando}</div>
    </div>
    ${item.obiettivo ? `<div class="field"><div class="flabel">Obiettivo</div><div class="fval">${item.obiettivo}</div></div>` : ''}
    <div class="field">
      <div class="flabel">Sorgente file</div>
      <div class="fval">${item.source}</div>
    </div>
    ${item.nonUsare ? `<div class="field"><div class="flabel">Non usarlo per</div><div class="fval warn">${item.nonUsare}</div></div>` : ''}
    ${item.workflow ? `<div class="field"><div class="flabel">Workflow</div><div class="fval">${item.workflow}</div></div>` : ''}
    ${item.note ? `<div class="field"><div class="flabel">Note / differenze</div><div class="fval">${item.note}</div></div>` : ''}

    <div class="field">
      <div class="flabel">Parametri</div>
      <table class="ptable">
        ${item.params.map(p => `<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]||''}</td></tr>`).join('')}
      </table>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('closeDetail').onclick = closeDetail;
}
function closeDetail(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') closeDetail(); };

document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; renderList(); });

renderChips();
renderList();

/* ---------- PWA install + service worker ---------- */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installToast').classList.add('show');
});
document.getElementById('installBtn').onclick = async () => {
  document.getElementById('installToast').classList.remove('show');
  if (deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
};
document.getElementById('dismissInstall').onclick = () => {
  document.getElementById('installToast').classList.remove('show');
};

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
